<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>盤中爆量預估 — {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #c9d1d9; }
        a { color: #58a6ff; }
        .nav-mini { background:#161b22; border-bottom:1px solid #30363d; padding:10px 20px; }
        .nav-mini a { color:#c9d1d9; text-decoration:none; margin-right:18px; font-weight:600; }
        .nav-mini a.active { color:#58a6ff; }
        .content-wrap { padding: 20px; }
        .badge{display:inline-block;padding:.25em .5em;font-size:.75em;border-radius:.375rem}
        .btn{display:inline-block;padding:.375rem .75rem;border:1px solid transparent;border-radius:.375rem;cursor:pointer}
        table.table { color:#c9d1d9; }
        table.table thead th { background:#161b22; }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="nav-mini">
        <span style="font-weight:700;color:#58a6ff;">📊 盤中爆量預估</span>
        <a href="{{ url_for('volume_alert') }}"
           class="{% if request.endpoint == 'volume_alert' %}active{% endif %}">即時看板</a>
        <span style="float:right;color:#8b949e;font-size:.85em">資料來源：TWSE MIS / 上市櫃公開資訊</span>
    </div>
    <div class="content-wrap">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
