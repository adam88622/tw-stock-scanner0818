{% extends "base.html" %}

{% block title %}{{ code }} — 錯誤{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="text-center">
        <h1 style="font-size: 6rem; color: #818cf8; font-weight: 700; margin-bottom: 0;">{{ code }}</h1>
        <p style="font-size: 1.5rem; color: #94a3b8; margin-top: 8px;">{{ message }}</p>
        <a href="/" class="btn btn-outline-light mt-4" style="border-color: #334155; color: #94a3b8;">
            返回首頁
        </a>
    </div>
</div>
{% endblock %}
