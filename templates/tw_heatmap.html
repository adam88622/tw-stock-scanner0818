{% extends "base.html" %}
{% block title %}台股熱力圖{% endblock %}

{% block content %}
<div class="content-area">
    <h4 class="page-title">台股類股熱力圖 <span id="heatmap-update-time" style="font-size:14px;color:var(--text-muted);margin-left:16px;"></span></h4>
    <div id="heatmap-status" style="padding:40px;text-align:center;font-size:18px;color:var(--text-muted);">載入中...</div>
    <div id="tw-heatmap-container"></div>
</div>

<style>
#tw-heatmap-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.tw-sector-group {
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    overflow: hidden;
}
.tw-sector-header {
    background: var(--bg-thead);
    padding: 8px 14px;
    font-size: 15px;
    font-weight: 700;
    color: #f59e0b;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}
.tw-sector-header:hover {
    background: var(--hover-bg);
}
.tw-sector-header .sector-avg {
    font-size: 14px;
    font-weight: 700;
}
.tw-sector-grid {
    display: flex;
    flex-wrap: wrap;
    padding: 6px;
    gap: 4px;
}
.tw-hm-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    padding: 8px 4px;
    min-height: 68px;
    cursor: pointer;
    transition: opacity 0.15s;
    border: 1px solid rgba(255,255,255,0.06);
    text-decoration: none;
}
.tw-hm-cell:hover {
    opacity: 0.85;
    border-color: rgba(255,255,255,0.2);
}
.tw-hm-ticker {
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    line-height: 1.2;
}
.tw-hm-pct {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.tw-hm-name {
    font-size: 10px;
    color: rgba(255,255,255,0.6);
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.tw-hm-price {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
}
.heatmap-error-box {
    padding: 24px;
    text-align: center;
    color: var(--text-secondary);
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 8px;
}
.heatmap-error-box .err-msg {
    color: #ef4444;
    font-weight: 600;
    margin-bottom: 12px;
}
.heatmap-error-box .last-success {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 12px;
}
.heatmap-retry-btn {
    background: var(--accent-color);
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}
.heatmap-retry-btn:hover {
    opacity: 0.9;
}
</style>
{% endblock %}

{% block scripts %}
<script>
(function() {
    function pctToColor(pct) {
        // 台灣慣例：紅漲綠跌
        if (pct === null || pct === undefined) return '#334155';
        var abs = Math.min(Math.abs(pct), 6);
        var intensity = abs / 6;
        if (pct > 0) {
            // 漲 = 紅色
            var r = Math.round(58 + intensity * 162);
            var g = Math.round(26 + intensity * 12);
            var b = Math.round(26 + intensity * 12);
            return 'rgb(' + r + ',' + g + ',' + b + ')';
        } else if (pct < 0) {
            // 跌 = 綠色
            var r = Math.round(26 - intensity * 10);
            var g = Math.round(58 + intensity * 105);
            var b = Math.round(42 - intensity * 2);
            return 'rgb(' + r + ',' + g + ',' + b + ')';
        }
        return '#334155';
    }

    function render(data) {
        var container = document.getElementById('tw-heatmap-container');
        var statusEl = document.getElementById('heatmap-status');
        if (statusEl) statusEl.style.display = 'none';

        var sectors = data.sectors;
        var date = data.date;

        // Calculate sector averages and sort by avg change desc
        var sectorList = [];
        for (var sectorName in sectors) {
            var stocks = sectors[sectorName];
            var totalPct = 0;
            var count = 0;
            stocks.forEach(function(s) {
                if (s.pct !== null && s.pct !== undefined) {
                    totalPct += s.pct;
                    count++;
                }
            });
            var avg = count > 0 ? totalPct / count : 0;
            sectorList.push({name: sectorName, stocks: stocks, avg: avg});
        }
        sectorList.sort(function(a, b) { return b.avg - a.avg; });

        var html = '';
        sectorList.forEach(function(sector) {
            var avgCls = sector.avg > 0 ? 'val-up' : sector.avg < 0 ? 'val-dn' : '';
            var avgSign = sector.avg >= 0 ? '+' : '';

            html += '<div class="tw-sector-group">';
            html += '<div class="tw-sector-header" onclick="window.location.href=\'/sector/' + encodeURIComponent(sector.name) + '\'">';
            html += '<span>' + sector.name + ' (' + sector.stocks.length + ')</span>';
            html += '<span class="sector-avg ' + avgCls + '">' + avgSign + sector.avg.toFixed(2) + '%</span>';
            html += '</div>';
            html += '<div class="tw-sector-grid">';

            // Calculate total volume for sizing
            var totalVol = 0;
            sector.stocks.forEach(function(s) { totalVol += (s.volume || 0); });

            sector.stocks.forEach(function(s) {
                var color = pctToColor(s.pct);
                var weight = totalVol > 0 ? Math.max(1, (s.volume || 0) / totalVol * 100) : 10;
                var pctStr = s.pct !== null ? (s.pct >= 0 ? '+' : '') + s.pct.toFixed(2) + '%' : 'N/A';

                html += '<a class="tw-hm-cell" href="/stock?id=' + s.id + '" style="background:' + color + ';flex:' + Math.max(1, weight) + ' 1 70px;max-width:25%;">';
                html += '<span class="tw-hm-ticker">' + s.id + '</span>';
                html += '<span class="tw-hm-pct">' + pctStr + '</span>';
                html += '<span class="tw-hm-name">' + s.name + '</span>';
                html += '<span class="tw-hm-price">' + (s.price ? s.price.toFixed(2) : '') + '</span>';
                html += '</a>';
            });

            html += '</div></div>';
        });

        container.innerHTML = html;

        document.getElementById('heatmap-update-time').textContent =
            '資料日期：' + (date || '');
    }

    var LS_KEY = 'heatmap_tw_last_success';

    function showError(msg) {
        var container = document.getElementById('tw-heatmap-container');
        var statusEl = document.getElementById('heatmap-status');
        if (statusEl) statusEl.style.display = 'none';
        var lastSuccess = localStorage.getItem(LS_KEY);
        var lastTxt = lastSuccess ? '上次成功時間：' + lastSuccess : '尚無歷史成功紀錄';
        var html = '<div class="heatmap-error-box">' +
            '<div class="err-msg">載入失敗：' + (msg || 'Error') + '</div>' +
            '<div class="last-success">' + lastTxt + '</div>' +
            '<button type="button" class="heatmap-retry-btn" id="heatmap-retry-btn">重試</button>' +
            '</div>';
        container.innerHTML = html;
        var btn = document.getElementById('heatmap-retry-btn');
        if (btn) {
            btn.addEventListener('click', function () {
                container.innerHTML = '';
                if (statusEl) {
                    statusEl.style.display = 'block';
                    statusEl.textContent = '載入中...';
                }
                loadHeatmap();
            });
        }
    }

    function loadHeatmap() {
        fetch('/api/tw-heatmap')
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function (data) {
                if (data.error) {
                    showError(data.error);
                    return;
                }
                render(data);
                var now = new Date();
                var hh = String(now.getHours()).padStart(2, '0');
                var mm = String(now.getMinutes()).padStart(2, '0');
                localStorage.setItem(LS_KEY, hh + ':' + mm);
                // 顯示即時/收盤狀態
                var timeEl = document.getElementById('heatmap-update-time');
                if (data.realtime) {
                    timeEl.textContent = '即時報價 更新: ' + (data.update_time || '') + ' (每5分鐘自動更新)';
                    timeEl.style.color = '#22c55e';
                } else {
                    timeEl.textContent = '收盤資料：' + (data.date || '');
                    timeEl.style.color = 'var(--text-muted)';
                }
            })
            .catch(function (err) {
                showError(err && err.message ? err.message : '網路錯誤');
            });
    }

    // 初次載入
    loadHeatmap();

    // 盤中自動刷新：每 5 分鐘（只在交易時段 9:00~13:30，週一至五）
    setInterval(function() {
        var now = new Date();
        var day = now.getDay();
        var hhmm = now.getHours() * 100 + now.getMinutes();
        if (day >= 1 && day <= 5 && hhmm >= 900 && hhmm <= 1330) {
            loadHeatmap();
        }
    }, 300000); // 5 分鐘
})();
</script>
{% endblock %}
